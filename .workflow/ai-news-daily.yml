version: '1.0'
name: ai-news-daily
displayName: AI资讯定时简报

# ====================== 触发规则 ======================
# Gitee Go 使用“分钟 小时 日 月 周”格式。
# 每天北京时间 08:00 和 20:00 各触发一次。
triggers:
  schedule:
    - cron: '0 8,20 * * ?'

# ====================== 流水线阶段 ======================
stages:
  - name: build_and_publish
    displayName: 生成简报 → 回写仓库 → 构建站点 → 部署 Pages
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      # 步骤 1：生成 AI 早报/晚报
      - step: shell@agent
        name: generate_ai_news_brief
        displayName: 1. 抓取新闻 + 生成早报/晚报
        script:
          - npm ci
          # 不传 --type 时，脚本会根据执行时间自动判断 morning / evening
          # --mode=review 表示生成后保持待审核；如果要完全自动发布，改成 --mode=auto
          - node scripts/publish-ai-news-brief.mjs --mode=review

      # 步骤 2：提交简报到主分支
      - step: shell@agent
        name: commit_briefs_to_repo
        displayName: 2. 提交简报到代码仓库（主分支）
        script:
          - git config user.name "GiteeGo"
          - git config user.email "giteego@ci.bot"
          - chmod +x scripts/gitee-askpass.sh
          - export GIT_ASKPASS="$PWD/scripts/gitee-askpass.sh"
          - export GIT_TERMINAL_PROMPT=0
          - git add src/content/ai-news/ src/data/ data/
          - git commit -m "auto: AI简报更新 $(date '+%Y-%m-%d %H:%M')" || true
          - git push https://gitee.com/RachelLeo/QQ_Web_Blog.git HEAD:master

      # 步骤 3：构建 Astro 静态站点
      - step: shell@agent
        name: build_astro_site
        displayName: 3. 构建 Astro 静态站点
        script:
          - npm run build

      # 步骤 4：部署到 Gitee Pages
      - step: shell@agent
        name: deploy_to_pages
        displayName: 4. 部署到 Gitee Pages (pages分支)
        script:
          # 保留 .gitignore 防止构建产物被意外提交
          - cp .gitignore dist/.gitignore 2>/dev/null || true
          - cd dist
          - git init
          - git config user.name "GiteeGo"
          - git config user.email "giteego@ci.bot"
          - chmod +x ../scripts/gitee-askpass.sh
          - export GIT_ASKPASS="$PWD/../scripts/gitee-askpass.sh"
          - export GIT_TERMINAL_PROMPT=0
          - git checkout -b pages
          - git add -A
          - git commit -m "deploy: AI简报更新 $(date '+%Y-%m-%d %H:%M')" || true
          - git remote add origin https://gitee.com/RachelLeo/QQ_Web_Blog.git
          - git push -f origin pages:pages
