version: "1.0"
name: 构建、部署到自有主机
displayName: 构建、部署到自有主机
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: ""
    displayName: Nodejs 构建
    nodeVersion: 20.10.0
    commands:
    - set -e
    - npm config set registry https://registry.npmmirror.com
    - npm ci
    - node scripts/publish-ai-news-brief.mjs --mode=auto --type=morning
    - npm run build
    - ""
    - export PAGES_USER="${PAGES_USER:-QQLeo}"
    - test -n "$PAGES_TOKEN" || (echo "ERROR: 请在 Gitee Go 流水线变量中配置 PAGES_TOKEN" && exit 1)
    - cat > /tmp/gitee-askpass.sh <<'EOF'
    - '#!/bin/sh'
    - case "$1" in
    - '  *Username*) printf ''%s\n'' "$PAGES_USER" ;;'
    - '  *Password*) printf ''%s\n'' "$PAGES_TOKEN" ;;'
    - '  *) printf ''\n'' ;;'
    - esac
    - EOF
    - chmod +x /tmp/gitee-askpass.sh
    - export GIT_ASKPASS=/tmp/gitee-askpass.sh
    - export GIT_TERMINAL_PROMPT=0
    - ""
    - cp .gitignore dist/.gitignore || true
    - cd dist
    - git init
    - git config user.name "GiteeGo"
    - git config user.email "giteego@ci.bot"
    - git checkout -b pages
    - git add -A
    - "git commit -m \"deploy: AI morning brief $(date '+%Y-%m-%d %H:%M')\" || true"
    - git remote add origin https://gitee.com/QQLeo/qq_web_blog.git
    - git push -f origin pages:pages
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./dist
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.yarn"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  schedule:
  - cron: '* * 8 * * ? *'
notify: []
strategy:
  blocking: true
